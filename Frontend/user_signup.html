<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshRoot - User Signup</title>
    <script src="https://kit.fontawesome.com/d9f55f49c0.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(0deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url("./image/background1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .form-box {
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 45px 50px 55px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .form-box h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 35px;
            color: #0f172a;
            position: relative;
        }

        .form-box h1::after {
            content: '';
            width: 36px;
            height: 4px;
            border-radius: 3px;
            background: #107d09;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-field {
            background: #f1f5f9;
            margin: 16px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            border: 1.5px solid transparent;
            transition: all 0.2s;
        }

        .input-field:focus-within {
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        input {
            width: 100%;
            background: transparent;
            border: 0;
            outline: 0;
            padding: 16px 14px;
            font-size: 15px;
            color: #1e293b;
            caret-color: #107d09;
        }

        .input-field i {
            margin-left: 16px;
            color: #64748b;
            font-size: 16px;
        }

        .button-field {
            width: 100%;
            display: flex;
            gap: 14px;
            justify-content: space-between;
        }

        .button-field button {
            flex: 1;
            background: #107d09;
            color: white;
            height: 46px;
            border-radius: 12px;
            border: 0;
            outline: 0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(16, 125, 9, 0.25);
        }

        .button-field button:hover {
            background: #0d6307;
            transform: translateY(-1px);
        }

        .button-field button[type="button"] {
            background: #f1f5f9;
            color: #475569;
            box-shadow: none;
        }

        .button-field button[type="button"]:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .login-redirect {
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }

        .login-redirect a {
            color: #107d09;
            font-weight: 600;
            text-decoration: none;
        }

        .login-redirect a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <button class="nav-back-btn" onclick="window.history.back()" title="Go Back" style="position: absolute; top: 25px; left: 25px; z-index: 100;"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <div class="form-box">
        <h1>Sign Up</h1>
        <form id="signupform" action="home.html" method="GET">
            <div class="input-group">
                <div class="input-field">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>

                <div class="input-field"> 
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>

            </div>

            <div class="button-field">
                <button type="button" onclick="resetForm()">Reset</button>
                <button type="submit">Sign Up</button>
            </div>

            <div class="login-redirect">
                Already have an account? <a href="user_login.html">Login</a>
            </div>
        </form>
    </div>

    <script>
        function resetForm(){
            document.getElementById('signupform').reset();
        }
    </script>
</body>
</html>
