<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshRoot - User Login</title>
    <script src="https://kit.fontawesome.com/d9f55f49c0.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(0deg, rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url("./image/background1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .form-box {
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 45px 50px 55px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .form-box h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 35px;
            color: #0f172a;
            position: relative;
        }

        .form-box h1::after {
            content: '';
            width: 36px;
            height: 4px;
            border-radius: 3px;
            background: #107d09;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-field {
            background: #f1f5f9;
            margin: 16px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            border: 1.5px solid transparent;
            transition: all 0.2s;
        }

        .input-field:focus-within {
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        input {
            width: 100%;
            background: transparent;
            border: 0;
            outline: 0;
            padding: 16px 14px;
            font-size: 15px;
            color: #1e293b;
            caret-color: #107d09;
        }

        .input-field i {
            margin-left: 16px;
            color: #64748b;
            font-size: 16px;
        }

        form p {
            text-align: left;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form p a {
            text-decoration: none;
            color: #107d09;
            font-weight: 600;
            cursor: pointer;
        }

        form p a:hover {
            text-decoration: underline;
        }

        .button-field {
            width: 100%;
            display: flex;
            gap: 14px;
            justify-content: space-between;
        }

        .button-field button {
            flex: 1;
            background: #107d09;
            color: white;
            height: 46px;
            border-radius: 12px;
            border: 0;
            outline: 0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(16, 125, 9, 0.25);
        }

        .button-field button:hover {
            background: #0d6307;
            transform: translateY(-1px);
        }

        .button-field button[type="button"] {
            background: #f1f5f9;
            color: #475569;
            box-shadow: none;
        }

        .button-field button[type="button"]:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #94a3b8;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #0f172a;
        }

        .modal input {
            width: 100%;
            margin: 15px 0;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            caret-color: #107d09;
        }

        .modal input:focus {
            border-color: #10b981;
            outline: none;
        }

        .modal button {
            background-color: #107d09;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .modal button:hover {
            background-color: #0d6307;
        }

    </style>
</head>

<body>
    <div class="form-box">
        <h1>Login</h1>
        <form id="signupform" action="home.html" method="GET">
            <div class="input-group">

                <div class="input-field"> 
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>

            </div>
            <p>Forgot password? <a id="forgotPasswordLink">Click Here</a></p>

            <div class="button-field">
                <button type="button" onclick="resetForm()">Reset</button>
                <button type="submit">Login</button>
            </div>

            <p style="text-align: center; margin-top: 25px; margin-bottom: 0;">
                Don't have an account? <a href="user_signup.html">Sign Up</a>
            </p>
        </form>
    </div>

    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 style="margin-top: 0; color: #0f172a;">Reset Password</h2>
            <p style="font-size: 13px; color: #64748b;">Enter your registered email to receive a password reset link.</p>
            <input type="email" id="forgotEmail" placeholder="Enter your email" required>
            <button onclick="sendResetLink()">Send Reset Link</button>
        </div>
    </div>

    <script>
        function resetForm(){
            document.getElementById('signupform').reset();
        }

        document.getElementById('forgotPasswordLink').onclick = function() {
            document.getElementById('forgotPasswordModal').style.display = 'block';
        };

        function closeModal() {
            document.getElementById('forgotPasswordModal').style.display = 'none';
        }

        function sendResetLink() {
            const email = document.getElementById('forgotEmail').value;
            if (email) {
                alert(`Password reset link sent to ${email}`);
                closeModal();
            } else {
                alert('Please enter a valid email.');
            }
        }
    </script>
</body>
</html>
