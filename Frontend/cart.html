<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="voice_widget.css">
    <script src="https://kit.fontawesome.com/d9f55f49c0.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center; /* Center content horizontally */
            justify-content: center; /* Center content vertically */
            background-image: linear-gradient(0deg, rgba(255, 255, 255, 0.234), rgba(193, 200, 239, 0.289)), url("./image/picc4.jpg");
            background-size: cover; 
            background-repeat: no-repeat; 
            background-position: center; 
        }

        h2 {
            color: #076e00;
            text-align: center;
            margin: 20px 0;
            font-size: 40px;
            line-height: 64px;
        }

        .cart-container {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            text-align: center;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #107d09;
            color: #fff;
        }

        .total, .proceed-container {
            text-align: right;
            margin-top: 20px;
            color: #107d09;
        }

        .total {
            font-size: 20px;
        }

        .proceed-container {
            display: flex; 
            justify-content: center; 
            width: 100%; 
        }

        .proceed-container a {
            text-decoration: none; 
            color: inherit; 
        }

        .proceed-container button {
            padding: 10px 20px;
            background: #107d09;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .proceed-container button:hover {
            background: #0b5e07;
        }

        .empty-cart {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            color: #777;
        }

        button {
            padding: 10px 20px;
            background: #107d09;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5e07;
        }
        
    </style>
</head>
<body>
    <div style="width: 100%; max-width: 800px; margin: 20px auto 0; display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
        <button class="nav-back-btn" onclick="window.history.back()" title="Go Back"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <a href="home.html" style="text-decoration: none; font-size: 20px; font-weight: 700; color: #107d09; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-leaf"></i> FreshRoot Home</a>
    </div>
    <!-- Cart Section -->
    <h2>Shopping Cart</h2>
    <div class="cart-container">
        <table id="cart-items">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Add items dynamically here -->
            </tbody>
        </table>
        <p id="total-price" class="total">Total: ₹0</p>
        <p id="empty-cart-message" class="empty-cart">Your cart is currently empty.</p>

        <div class="proceed-container">
            <a href="payment.html" style="text-decoration: none; color: inherit;">
                <button id="proceed-button" onclick="proceedToBuy()">Proceed to Buy</button>
            </a>
        </div>
    </div>

    <script>
        function getApiUrl(path) {
            if (window.location.protocol === 'file:' || (window.location.port !== '5000' && window.location.port !== '')) {
                return 'http://127.0.0.1:5000' + path;
            }
            return path;
        }

        async function loadCart() {
            const cartItems = document.getElementById("cart-items").querySelector("tbody");
            const totalPriceElement = document.getElementById("total-price");
            const emptyCartMessage = document.getElementById("empty-cart-message");
            const proceedBtn = document.getElementById("proceed-button");

            try {
                const res = await fetch(getApiUrl('/api/cart'));
                const data = await res.json();
                const cart = data.cart || [];
                const total = data.total || 0;

                cartItems.innerHTML = "";

                if (cart.length === 0) {
                    emptyCartMessage.style.display = "block";
                    totalPriceElement.style.display = "none";
                    if (proceedBtn) proceedBtn.style.display = "none";
                    return;
                }

                emptyCartMessage.style.display = "none";
                totalPriceElement.style.display = "block";
                if (proceedBtn) proceedBtn.style.display = "inline-block";

                cart.forEach((item) => {
                    const title = item.product_title || item.product_type || item.name || "Produce Item";
                    const qty = item.qty || item.quantity || 1;
                    const price = item.product_price || item.price || 0;
                    const subtotal = item.subtotal || (qty * price);

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td style="display: flex; align-items: center; gap: 10px;">
                            <img src="./image/${item.product_image || 'capsicum.jpg'}" onerror="this.src='./image/background1.jpg'" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px;" alt="${title}">
                            <span>${title}</span>
                        </td>
                        <td>${qty}</td>
                        <td>₹${price}</td>
                        <td>₹${subtotal}</td>
                        <td><button onclick="removeItem(${item.id})" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Remove</button></td>
                    `;
                    cartItems.appendChild(row);
                });

                totalPriceElement.textContent = `Total: ₹${total}`;
            } catch (err) {
                console.error("Failed to load cart:", err);
            }
        }

        async function removeItem(cartId) {
            try {
                await fetch(getApiUrl(`/api/cart?id=${cartId}`), { method: 'DELETE' });
                await loadCart();
                if (typeof window.FreshRootVoice !== 'undefined') {
                    window.FreshRootVoice.refreshCartBadge();
                }
            } catch (err) {
                console.error("Failed to remove item:", err);
            }
        }

        function proceedToBuy() {
            window.location.href = "payment.html";
        }

        window.loadCart = loadCart;
        window.removeItem = removeItem;
        window.addEventListener('DOMContentLoaded', loadCart);
        window.addEventListener('cartUpdated', loadCart);
        window.addEventListener('focus', loadCart);
        window.addEventListener('storage', loadCart);
        loadCart();
    </script>
    <!-- Floating Voice Assistant Action Button -->
    <button class="floating-ai-btn" onclick="FreshRootVoice.activate()" title="Activate AI Voice Assistant">
        <i class="fa-solid fa-robot"></i>
    </button>
    <script src="voice_widget.js"></script>
</body>
</html>
